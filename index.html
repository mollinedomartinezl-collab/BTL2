<!-- SCRIPTS DE INTERACCIÓN Y CANEVAS -->
<script>
/* CANVAS FONDO ANIMADO */
(function(){
  "use strict";
  var canvas = document.getElementById('networkCanvas');
  if(!canvas) return;
  var ctx = canvas.getContext('2d');
  var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  
  var COLORS = { bg: '10,42,64', dot: '143,216,58', line: '28,111,168' };
  var width = 0, height = 0, dpr = 1, nodes = [], rafId = null;

  function Node(){
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.vx = (Math.random() - 0.5) * 0.2;
    this.vy = (Math.random() - 0.5) * 0.2;
    this.radius = Math.random() * 1.5 + 1;
  }

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    nodes = [];
    var count = width < 600 ? 25 : 55;
    for(var i=0; i<count; i++) nodes.push(new Node());
  }

  function draw(){
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = 'rgb(' + COLORS.bg + ')';
    ctx.fillRect(0, 0, width, height);

    for(var i=0; i<nodes.length; i++){
      var a = nodes[i];
      a.x += a.vx; a.y += a.vy;
      if(a.x < 0 || a.x > width) a.vx *= -1;
      if(a.y < 0 || a.y > height) a.vy *= -1;

      ctx.beginPath();
      ctx.arc(a.x, a.y, a.radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + COLORS.dot + ',0.5)';
      ctx.fill();

      for(var j=i+1; j<nodes.length; j++){
        var b = nodes[j];
        var dx = a.x - b.x, dy = a.y - b.y;
        var dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < 130){
          ctx.strokeStyle = 'rgba(' + COLORS.line + ',' + (1 - dist/130)*0.25 + ')';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }
    if(!prefersReduced) rafId = requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize();
  draw();
})();

/* CONTROLES DE UI Y LIGHTBOX */
(function(){
  var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var items = document.querySelectorAll('[data-animate]');
  
  if(prefersReduced || !('IntersectionObserver' in window)){
    items.forEach(function(el){ el.classList.add('is-visible'); });
  } else {
    var observer = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });
    items.forEach(function(el){ observer.observe(el); });
  }

  var progress = document.getElementById('scrollProgress');
  var header = document.getElementById('siteHeader');
  var toTop = document.getElementById('toTop');
  
  window.addEventListener('scroll', function(){
    var scrolled = document.documentElement.scrollTop;
    var max = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    progress.style.width = (scrolled / max * 100) + '%';
    header.classList.toggle('scrolled', scrolled > 30);
    toTop.classList.toggle('show', scrolled > 400);
  }, { passive:true });

  toTop.addEventListener('click', function(){ window.scrollTo({ top:0, behavior:'smooth' }); });

  /* Drawer Navigation */
  var trigger = document.getElementById('menuTrigger');
  var backdrop = document.getElementById('drawerBackdrop');
  var drawer = document.getElementById('sideDrawer');
  
  function toggleDrawer(open){
    document.body.classList.toggle('drawer-open', open);
    trigger.setAttribute('aria-expanded', open);
  }
  
  trigger.addEventListener('click', function(){ toggleDrawer(!document.body.classList.contains('drawer-open')); });
  backdrop.addEventListener('click', function(){ toggleDrawer(false); });
  drawer.querySelectorAll('[data-drawer-link]').forEach(function(a){
    a.addEventListener('click', function(){ toggleDrawer(false); });
  });

  /* Lightbox Galería */
  var lightbox = document.getElementById('lightbox');
  var lbImg = document.getElementById('lbImg');
  var lbClose = document.getElementById('lbClose');
  var lbPrev = document.getElementById('lbPrev');
  var lbNext = document.getElementById('lbNext');
  var currentImgs = [], currentIdx = 0;

  document.querySelectorAll('.gallery').forEach(function(gal){
    var imgs = Array.prototype.slice.call(gal.querySelectorAll('img'));
    imgs.forEach(function(img, idx){
      img.parentElement.addEventListener('click', function(){
        currentImgs = imgs;
        currentIdx = idx;
        lbImg.src = img.src;
        lightbox.classList.add('open');
      });
    });
  });

  function closeLb(){ lightbox.classList.remove('open'); }
  function navLb(dir){
    currentIdx = (currentIdx + dir + currentImgs.length) % currentImgs.length;
    lbImg.src = currentImgs[currentIdx].src;
  }

  lbClose.addEventListener('click', closeLb);
  lbPrev.addEventListener('click', function(){ navLb(-1); });
  lbNext.addEventListener('click', function(){ navLb(1); });
  lightbox.addEventListener('click', function(e){ if(e.target === lightbox) closeLb(); });
})();
</script>
